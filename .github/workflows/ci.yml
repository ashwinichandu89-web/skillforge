name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: skillforge, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: skillforge }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillforge" --health-interval 5s --health-retries 10
    env:
      ENV: development
      DATABASE_URL: postgresql+psycopg2://skillforge:ci-only-password@localhost:5432/skillforge
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations apply cleanly and are reversible
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m app.db.seed
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund   # switch to `npm ci` once package-lock.json is committed
      - run: npm run build   # type-checks, then bundles
      - run: npm test --if-present
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skillforge-backend backend
      - run: docker build -t skillforge-web frontend
